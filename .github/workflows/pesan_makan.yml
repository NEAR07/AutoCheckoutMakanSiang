name: Automasi Pesan Makan Siang

on:
  workflow_dispatch:
  schedule:
    # Berjalan setiap hari jam 19:00 WIB (12:00 UTC)
    - cron: '0 12 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil kode dari repository
      uses: actions/checkout@v4

    - name: Menyiapkan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Menginstal library Selenium
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Menjalankan Bot Pesan Makan
      env:
        LOGIN_NIP_1: ${{ secrets.LOGIN_NIP_1 }}
        PASSWORD_NIP_1: ${{ secrets.PASSWORD_NIP_1 }}
        LOGIN_NIP_2: ${{ secrets.LOGIN_NIP_2 }}
        PASSWORD_NIP_2: ${{ secrets.PASSWORD_NIP_2 }}
      run: python main.py
