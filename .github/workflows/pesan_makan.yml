name: Automasi Pesan Makan Siang

on:
  schedule:
    # Berjalan setiap hari jam 19:00 WIB (12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil kode dari repository
      uses: actions/checkout@v4

    - name: Menyiapkan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Menginstal library Selenium
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Menjalankan Bot Pesan Makan
      env:
        LOGIN_NIP: ${{ secrets.LOGIN_NIP }}
        LOGIN_PASS: ${{ secrets.LOGIN_PASS }}
      run: python main.py
