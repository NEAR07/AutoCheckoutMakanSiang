name: Automasi Pesan Makan Siang

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Mengambil kode dari repository
      uses: actions/checkout@v4

    - name: Menyiapkan Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Menginstal library Selenium
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Menjalankan Bot Pesan Makan (dengan Auto-Retry)
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 20
        max_attempts: 3
        retry_on: error
        command: python main.py
      env:
        LOGIN_NIP_1: ${{ secrets.LOGIN_NIP_1 }} #Nizhar
        PASSWORD_NIP_1: ${{ secrets.PASSWORD_NIP_1 }}
        LOGIN_NIP_2: ${{ secrets.LOGIN_NIP_2 }} #Roni
        PASSWORD_NIP_2: ${{ secrets.PASSWORD_NIP_2 }}
        LOGIN_NIP_3: ${{ secrets.LOGIN_NIP_3 }} #Irwan
        PASSWORD_NIP_3: ${{ secrets.PASSWORD_NIP_3 }}
        LOGIN_NIP_4: ${{ secrets.LOGIN_NIP_4 }} #Ayu
        PASSWORD_NIP_4: ${{ secrets.PASSWORD_NIP_4 }}
        LOGIN_NIP_5: ${{ secrets.LOGIN_NIP_5 }} #Yusuf
        PASSWORD_NIP_5: ${{ secrets.PASSWORD_NIP_5 }}
        LOGIN_NIP_6: ${{ secrets.LOGIN_NIP_6 }} #Yadi
        PASSWORD_NIP_6: ${{ secrets.PASSWORD_NIP_6 }}
        LOGIN_NIP_7: ${{ secrets.LOGIN_NIP_7 }} #Dimas
        PASSWORD_NIP_7: ${{ secrets.PASSWORD_NIP_7 }}


    - name: Upload Bukti Error (Screenshot & Log)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-artifacts
        path: |
          *.png
          *.html
