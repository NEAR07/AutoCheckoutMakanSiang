name: Automasi Pesan Makan Siang

on:
  schedule:
    # Jadwal: Berjalan setiap hari (Senin-Minggu) pada pukul 12:00 UTC (19:00 WIB)
    - cron: '0 12 * * *'
  workflow_dispatch: # Memunculkan tombol agar bisa dijalankan manual kapan saja

jobs:
  run-bot:
    runs-on: ubuntu-latest # Server cloud gratis dari GitHub

    steps:
    - name: Mengambil kode dari repository
      uses: actions/checkout@v3

    - name: Menyiapkan Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Menginstal library Selenium
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Menjalankan Bot Pesan Makan
      run: python main.py
